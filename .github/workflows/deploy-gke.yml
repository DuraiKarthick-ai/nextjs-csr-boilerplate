
name: Build & Deploy Frontend to GKE

on:
  push:
    branches:
      - feature/workflow

env:
  PROJECT_ID: ust-gcp-costco-replatform-poc
  REGION: us-central1
  REPOSITORY: signs-spa-repo
  IMAGE_NAME: ui-frontend
  CLUSTER_NAME: spa-cluster
  CLUSTER_LOCATION: us-central1
  NAMESPACE: spa-signs-remote-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}      
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}      
      
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --region $CLUSTER_LOCATION \
            --project $PROJECT_ID

      - name: Create namespace if not exists
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
         
          kubectl apply -f k8s/deployment.yaml -n $NAMESPACE
          kubectl apply -f k8s/service.yaml -n $NAMESPACE

      - name: Update deployment image
        run: |
          kubectl set image deployment/nextjs-csr-app \
            nextjs-csr-app=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
            -n $NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nextjs-csr-app -n $NAMESPACE --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment nextjs-csr-app -n $NAMESPACE
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods -l app=nextjs-csr-app -n $NAMESPACE
          echo ""
          echo "=== Service Status ==="
          kubectl get svc nextjs-csr-app-service -n $NAMESPACE
          echo ""
          echo "=== Get External IP ==="
          kubectl get svc nextjs-csr-app-service -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
