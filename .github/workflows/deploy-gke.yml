
name: Build & Deploy Frontend to GKE

on:
  push:
    branches:
      - feature/workflow

env:
  PROJECT_ID: ust-gcp-costco-replatform-poc
  REGION: us-central1
  REPOSITORY: signs-spa-repo
  IMAGE_NAME: ui-frontend
  CLUSTER_NAME: spa-cluster
  CLUSTER_LOCATION: us-central1
  NAMESPACE: spa-signs-remote-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}      
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}      
      
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --region $CLUSTER_LOCATION \
            --project $PROJECT_ID      
            
      - name: Create namespace if not exists
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Image Pull Secret
        run: |
          kubectl create secret docker-registry gcr-json-key \
            --docker-server=$REGION-docker.pkg.dev \
            --docker-username=_json_key \
            --docker-password="$(cat $GOOGLE_GHA_CREDS_PATH)" \
            --docker-email=gke-spa-sa@ust-gcp-costco-replatform-poc.iam.gserviceaccount.com \
            -n $NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
         
          kubectl apply -f k8s/deployment.yaml -n $NAMESPACE
          kubectl apply -f k8s/service.yaml -n $NAMESPACE
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/nextjs-csr-app \
            nextjs-csr-app=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
            -n $NAMESPACE

      - name: Check pod status
        run: |
          echo "=== Checking pod status after image update ==="
          kubectl get pods -n $NAMESPACE -l app=nextjs-csr-app
          echo ""
          echo "=== Describing pods ==="
          kubectl describe pods -n $NAMESPACE -l app=nextjs-csr-app || true
          echo ""
          echo "=== Pod logs (if available) ==="
          kubectl logs -n $NAMESPACE -l app=nextjs-csr-app --tail=50 --all-containers=true || true      
          
      - name: Wait for rollout
        continue-on-error: true
        run: |
          kubectl rollout status deployment/nextjs-csr-app -n $NAMESPACE --timeout=10m

      - name: Debug failed deployment
        if: always()
        run: |
          # Fetch kubeconfig defensively: this step runs `if: always()`, so it
          # may execute before (or instead of) the dedicated "Get GKE credentials"
          # step when an earlier step (e.g. Docker build) fails. Without this,
          # kubectl falls back to http://localhost:8080 and emits a confusing
          # "connection refused" error that masks the real failure.
          if ! kubectl version --request-timeout=5s >/dev/null 2>&1; then
            echo "kubectl has no cluster context — fetching GKE credentials..."
            gcloud container clusters get-credentials "$CLUSTER_NAME" \
              --region "$CLUSTER_LOCATION" \
              --project "$PROJECT_ID" || {
                echo "Failed to fetch GKE credentials; skipping pod debug."
                exit 0
              }
          fi
          echo "=== Final Pod Status ==="
          kubectl get pods -n $NAMESPACE -l app=nextjs-csr-app -o wide
          echo ""
          echo "=== Pod Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' | grep nextjs-csr-app || true
          echo ""
          echo "=== Failed Pod Logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app=nextjs-csr-app -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for $pod ---"
            kubectl logs -n $NAMESPACE $pod --tail=100 || true
            echo ""
            echo "--- Describe $pod ---"
            kubectl describe pod -n $NAMESPACE $pod || true
            echo ""
          done

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment nextjs-csr-app -n $NAMESPACE
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods -l app=nextjs-csr-app -n $NAMESPACE
          echo ""
          echo "=== Service Status ==="
          kubectl get svc nextjs-csr-app-service -n $NAMESPACE
          echo ""
          echo "=== Get External IP ==="
          kubectl get svc nextjs-csr-app-service -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
