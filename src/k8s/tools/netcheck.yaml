apiVersion: batch/v1
kind: Job
metadata:
  name: netcheck
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: nc
          image: us-docker.pkg.dev/gcp-prj-images/gcp-gar-repo-merchapps/busybox:1.36
          command: ["sh", "-c", "nc -vz -w 3 10.240.3.3 3307 || exit 2"]
