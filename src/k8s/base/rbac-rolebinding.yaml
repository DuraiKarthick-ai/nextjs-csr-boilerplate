  namespace: #{GKE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: User
    name: #{GKE_DPL_SERVICE_ACCOUNT}
