apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-gsm-app
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/#{GKE_PROJECT_ID}/secrets/<DB_USER_SECRET>/versions/latest"
        fileName: "db-username"
      - resourceName: "projects/#{GKE_PROJECT_ID}/secrets/<DB_PASSWORD_SECRET>/versions/latest"
        fileName: "db-password"
