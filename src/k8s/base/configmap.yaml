apiVersion: v1
kind: ConfigMap
metadata:
  name: #{SERVICE_IMAGENAME}-#{SERVICE_TYPE}-config
  namespace: #{GKE_NAMESPACE}
data:
  NEXT_PUBLIC_ENV: "#{CD_ENVIRONMENT_LOWER}"
  NEXT_PRIVATE_LOCAL_WEBPACK: "true"
  NEXT_PUBLIC_AUTH_REQUIRED: "false"
  ENABLE_MODULE_FEDERATION: "true"

  # Public API base URL (Signs app's own origin — required for MF cross-origin API calls)
  NEXT_PUBLIC_API_BASE_URL: "#{NEXT_PUBLIC_API_BASE_URL}"

  # Module Federation portal URL — value injected per environment by CI/CD pipeline
  NEXT_PUBLIC_PORTAL_REMOTE_URL: "#{NEXT_PUBLIC_PORTAL_REMOTE_URL}"

  # Ping SSO
  NEXT_PUBLIC_PING_ISSUER: "https://loginnp.costco.com"
  NEXT_PUBLIC_PING_CLIENT_ID: "5c246b05-ddfa-45f2-a8e5-61623873c1c2"

  # WebSocket print relay
  WS_RELAY_ENABLED: "true"
  WS_RELAY_TOKEN: ""

  # Signs batch & OAuth API (server-side only — NEVER prefix with NEXT_PUBLIC_)
  SIGNS_OAUTH_TOKEN_URL: "#{SIGNS_OAUTH_TOKEN_URL}"
  SIGNS_APIGEE_CLIENT_ID: "#{SIGNS_APIGEE_CLIENT_ID}"
  SIGNS_APIGEE_CLIENT_SECRET: "#{SIGNS_APIGEE_CLIENT_SECRET}"
  SIGNS_API_BASE_URL: "#{SIGNS_API_BASE_URL}"

  # ECS Print Server (server-side only)
  ECS_WEB_USERNAME: "CostcoWS"
  ECS_WEB_PASSWORD: "dlm429t"
  ECS_WEB_API_TOKEN: "57e1bc49ff598e7495f8b35739848ad2"
  ECS_PRINT_USERNAME: "ECS"
  ECS_PRINT_SERVER_URL: "#{ECS_PRINT_SERVER_URL}"
  ECS_PRINT_WS_URL: "#{ECS_PRINT_WS_URL}"
  ECS_PRINT_LOCAL_SERVER_URL: "#{ECS_PRINT_LOCAL_SERVER_URL}"
  ECS_WEB_SERVER_URL: "#{ECS_WEB_SERVER_URL}"
