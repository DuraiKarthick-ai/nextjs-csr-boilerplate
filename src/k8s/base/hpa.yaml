apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{SERVICE_IMAGENAME}-#{SERVICE_TYPE}-hpa-nextgen
  namespace: #{GKE_NAMESPACE}
  labels:
    app: #{SERVICE_IMAGENAME}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{SERVICE_IMAGENAME}-#{SERVICE_TYPE}      # MUST match deployment.metadata.name
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
