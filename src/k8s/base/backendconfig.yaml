apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: #{SERVICE_IMAGENAME}-#{SERVICE_TYPE}-backend-config
  namespace: #{GKE_NAMESPACE}
spec:
  timeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 3002
